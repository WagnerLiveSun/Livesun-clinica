services:
  - type: web
    name: livesun-clinica
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx -y pnpm@10.4.1 install && npx -y pnpm@10.4.1 run build
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_MASTER_KEY
        generateValue: true
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: VITE_APP_TITLE
        value: SunSet
