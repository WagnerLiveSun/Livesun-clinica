services:
  - type: web
    name: livesun-clinica
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_MASTER_KEY
        generateValue: true
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: VITE_APP_TITLE
        value: SunSet
